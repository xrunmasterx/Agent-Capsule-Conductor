id: critical-review.claude
version: "0.1.0"
name: Critical Review
description: Claude SDK adapter capsule stub for structured review tasks.
runtime:
  type: claude_sdk
  command: null
  args_base: []
workspace:
  mode: existing_dir
permissions:
  sandbox: read-only
  network: false
  write_files: false
  timeout_seconds: 120
  allow_dangerous: false
prompt:
  template: prompt_template.md
schema:
  input: input_schema.json
  output: output_schema.json
artifacts:
  manifest: artifact_manifest.yaml

