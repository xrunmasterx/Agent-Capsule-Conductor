id: semiconductor-news-research.codex
version: "0.1.0"
name: Semiconductor News Research
description: Uses Codex CLI to collect semiconductor market news into a detailed artifact bundle.
runtime:
  type: codex_cli
  command: codex
  args_base:
    - exec
workspace:
  mode: existing_dir
permissions:
  sandbox: read-only
  network: true
  write_files: false
  timeout_seconds: 180
  allow_dangerous: false
prompt:
  template: prompt_template.md
schema:
  input: input_schema.json
  output: output_schema.json
artifacts:
  manifest: artifact_manifest.yaml
