id: file-source.local
version: "0.1.0"
name: File Source
description: Reads a file or directory from the bound workflow workspace and emits a manifest artifact.
runtime:
  type: generic_cli
  command: python
  args_base:
    - -m
    - acc.file_source_tool
workspace:
  mode: existing_dir
permissions:
  sandbox: read-only
  network: false
  write_files: false
  timeout_seconds: 30
  allow_dangerous: false
prompt:
  template: prompt_template.md
schema:
  input: input_schema.json
  output: output_schema.json
artifacts:
  manifest: artifact_manifest.yaml
