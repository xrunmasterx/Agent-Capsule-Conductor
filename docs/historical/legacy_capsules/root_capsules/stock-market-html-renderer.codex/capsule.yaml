id: stock-market-html-renderer.codex
version: "0.1.0"
name: Stock Market HTML Renderer
description: Codex-backed capsule for turning a stock market analysis report into a simple standalone HTML document.
kind: agent_session
runtime:
  type: codex_cli
  command: codex
  args_base:
    - exec
workspace:
  mode: existing_dir
permissions:
  sandbox: read-only
  network: false
  write_files: false
  timeout_seconds: 300
  allow_dangerous: false
prompt:
  template: prompt_template.md
schema:
  input: input_schema.json
  output: output_schema.json
artifacts:
  manifest: artifact_manifest.yaml
