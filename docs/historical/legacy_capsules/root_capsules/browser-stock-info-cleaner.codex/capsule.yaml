id: browser-stock-info-cleaner.codex
version: 0.1.0
name: 浏览器股市信息清理
description: 对上游调研结果做甄别、去噪和可信度分析。
runtime:
  type: codex_cli
workspace:
  mode: existing_dir
permissions:
  sandbox: read-only
  network: true
  write_files: false
  timeout_seconds: 600
  allow_dangerous: false
prompt:
  template: prompt_template.md
schema:
  input: input_schema.json
  output: output_schema.json
artifacts:
  manifest: artifact_manifest.yaml
