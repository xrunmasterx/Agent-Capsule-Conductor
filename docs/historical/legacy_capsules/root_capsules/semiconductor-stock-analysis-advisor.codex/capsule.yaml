id: semiconductor-stock-analysis-advisor.codex
version: 0.1.0
name: 半导体股市分析和建议
description: 基于高价值半导体股市信息分析市场并给出操作建议。
runtime:
  type: codex_cli
workspace:
  mode: existing_dir
permissions:
  sandbox: read-only
  network: true
  write_files: false
  timeout_seconds: 600
  allow_dangerous: false
prompt:
  template: prompt_template.md
schema:
  input: input_schema.json
  output: output_schema.json
artifacts:
  manifest: artifact_manifest.yaml
