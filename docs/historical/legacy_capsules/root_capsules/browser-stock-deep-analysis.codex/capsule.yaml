id: browser-stock-deep-analysis.codex
version: 0.1.0
name: 浏览器股市深度分析
description: 基于清理后的信息做消息面与情绪面的综合分析。
runtime:
  type: codex_cli
workspace:
  mode: existing_dir
permissions:
  sandbox: read-only
  network: true
  write_files: false
  timeout_seconds: 600
  allow_dangerous: false
prompt:
  template: prompt_template.md
schema:
  input: input_schema.json
  output: output_schema.json
artifacts:
  manifest: artifact_manifest.yaml
