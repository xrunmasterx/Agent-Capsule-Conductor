id: semiconductor-stock-news-collector.codex
version: 0.1.0
name: 半导体股市信息收集
description: 收集至少20条半导体相关的股市新闻。
runtime:
  type: codex_cli
workspace:
  mode: existing_dir
permissions:
  sandbox: read-only
  network: true
  write_files: false
  timeout_seconds: 600
  allow_dangerous: false
prompt:
  template: prompt_template.md
schema:
  input: input_schema.json
  output: output_schema.json
artifacts:
  manifest: artifact_manifest.yaml
