id: echo-test-copy.generic
version: 0.1.0
name: Echo Test Copy
description: Echoes the input payload through the generic CLI adapter.
runtime:
  type: generic_cli
  command: python
  args_base:
  - -m
  - acc.fake_agents
  - echo
workspace:
  mode: existing_dir
permissions:
  sandbox: read-only
  network: false
  write_files: false
  timeout_seconds: 30
  allow_dangerous: false
prompt:
  template: prompt_template.md
schema:
  input: input_schema.json
  output: output_schema.json
artifacts:
  manifest: artifact_manifest.yaml
