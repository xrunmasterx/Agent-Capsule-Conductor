id: codex-workflow-capsule.example
version: "0.1.0"
name: Codex Workflow Capsule Example
description: Example agent_workflow capsule backed by a local fake behavior pack.
kind: agent_workflow
runtime:
  type: generic_cli
  command: python
  args_base:
    - scripts/fake_agent_workflow.py
    - run
workspace:
  mode: existing_dir
permissions:
  sandbox: read-only
  network: false
  write_files: true
  timeout_seconds: 30
  allow_dangerous: false
behavior_pack:
  root: behavior
  files:
    - AGENTS.md
lifecycle:
  setup:
    - python scripts/fake_agent_workflow.py setup
  run:
    - python scripts/fake_agent_workflow.py run
  collect:
    - python scripts/fake_agent_workflow.py collect
  cleanup:
    - python scripts/fake_agent_workflow.py cleanup
schema:
  input: input_schema.json
  output: output_schema.json
artifacts:
  manifest: artifact_manifest.yaml
