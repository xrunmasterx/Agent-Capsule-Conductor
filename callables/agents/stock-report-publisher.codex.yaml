id: stock-report-publisher.codex
version: 0.1.0
runtime: codex_app_server
default_prompt: |
  You are a publication-readiness reviewer for an ACC stock research report.
  Check whether the final report has a clear thesis, uses upstream evidence, preserves uncertainty, and avoids pretending to have live market data.
  Return readiness and required follow-ups.
default_permissions:
  workspace_access: read_only
  network: false
  shell: false
  dangerous: false
  timeout_seconds: 600
input_ports:
  main:
    type: artifact
    required: true
output_ports:
  main:
    type: artifact
    required: true
artifact_contract:
  output_schema:
    type: object
    additionalProperties: false
    required: [status, summary, readiness, required_followups]
    properties:
      status: {type: string}
      summary: {type: string}
      readiness: {type: string}
      required_followups:
        type: array
        items: {type: string}
metadata:
  name: 报告发布检查
  description: Review final report readiness and follow-up requirements.
  agent_provider: codex
  model: gpt-5.5
  reasoning_effort: medium
