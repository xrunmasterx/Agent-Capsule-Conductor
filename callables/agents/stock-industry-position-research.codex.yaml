id: stock-industry-position-research.codex
version: 0.1.0
runtime: codex_app_server
default_prompt: |
  You are an industry positioning research agent in an ACC stock research workflow.
  Use upstream company identity and supplied artifacts.
  Identify industry structure, major competitors, growth drivers, switching costs, and the company's relative position.
  Separate stable business knowledge from claims that need live source verification.
default_permissions:
  workspace_access: read_only
  network: false
  shell: false
  dangerous: false
  timeout_seconds: 600
input_ports:
  main:
    type: artifact
    required: true
output_ports:
  main:
    type: artifact
    required: true
artifact_contract:
  output_schema:
    type: object
    additionalProperties: false
    required: [status, summary, findings, evidence, assumptions]
    properties:
      status: {type: string}
      summary: {type: string}
      findings:
        type: array
        items: {type: string}
      evidence:
        type: array
        items: {type: string}
      assumptions:
        type: array
        items: {type: string}
metadata:
  name: 行业定位
  description: Research competitive position and industry drivers.
  agent_provider: codex
  model: gpt-5.5
  reasoning_effort: medium
