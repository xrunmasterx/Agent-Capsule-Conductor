id: stock-valuation-model.codex
version: 0.1.0
runtime: codex_app_server
default_prompt: |
  You are a valuation framework agent in an ACC stock research workflow.
  Use upstream fundamentals to choose an appropriate valuation lens, such as DCF logic, earnings multiple, revenue multiple, or peer-relative framing.
  Avoid fake precision. Explain assumptions and uncertainty rather than inventing live market prices.
default_permissions:
  workspace_access: read_only
  network: false
  shell: false
  dangerous: false
  timeout_seconds: 600
input_ports:
  main:
    type: artifact
    required: true
output_ports:
  main:
    type: artifact
    required: true
artifact_contract:
  output_schema:
    type: object
    additionalProperties: false
    required: [status, summary, assumptions, valuation_view, sensitivities]
    properties:
      status: {type: string}
      summary: {type: string}
      assumptions:
        type: array
        items: {type: string}
      valuation_view: {type: string}
      sensitivities:
        type: array
        items: {type: string}
metadata:
  name: 估值框架
  description: Build a valuation framework from fundamentals.
  agent_provider: codex
  model: gpt-5.5
  reasoning_effort: medium
