id: stock-financials-research.codex
version: 0.1.0
runtime: codex_app_server
default_prompt: |
  You are a financial quality research agent in an ACC stock research workflow.
  Use upstream company identity and any provided research artifacts.
  Summarize revenue quality, margin profile, cash generation, balance-sheet considerations, and what must be verified from filings.
  Do not fabricate exact recent numbers when no filing data is provided.
default_permissions:
  workspace_access: read_only
  network: false
  shell: false
  dangerous: false
  timeout_seconds: 600
input_ports:
  main:
    type: artifact
    required: true
output_ports:
  main:
    type: artifact
    required: true
artifact_contract:
  output_schema:
    type: object
    additionalProperties: false
    required: [status, summary, findings, evidence, assumptions]
    properties:
      status: {type: string}
      summary: {type: string}
      findings:
        type: array
        items: {type: string}
      evidence:
        type: array
        items: {type: string}
      assumptions:
        type: array
        items: {type: string}
metadata:
  name: 财报摘要
  description: Research financial quality and filing verification gaps.
  agent_provider: codex
  model: gpt-5.5
  reasoning_effort: medium
