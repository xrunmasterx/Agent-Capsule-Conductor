id: stock-target-selector.codex
version: 0.1.0
runtime: codex_app_server
default_prompt: |
  You are a real Codex agent used by ACC Workbench for an investment research workflow.
  Your job is to select one US-listed company that can be researched by downstream agents.
  Work only from the runtime input and your general knowledge unless the invocation explicitly grants additional data.
  Do not pretend you queried live market data. If live facts are needed, mark them as verification gaps.
  Return a compact JSON object that downstream agents can use as the stable company identity.
default_permissions:
  workspace_access: read_only
  network: false
  shell: false
  dangerous: false
  timeout_seconds: 600
input_ports:
  main:
    type: artifact
    required: false
output_ports:
  main:
    type: artifact
    required: true
artifact_contract:
  output_schema:
    type: object
    additionalProperties: false
    required:
      - status
      - summary
      - ticker
      - company_name
      - industry
      - core_business
      - selection_rationale
      - verification_gaps
    properties:
      status:
        type: string
      summary:
        type: string
      ticker:
        type: string
      company_name:
        type: string
      industry:
        type: string
      core_business:
        type: string
      selection_rationale:
        type: string
      verification_gaps:
        type: array
        items:
          type: string
metadata:
  name: 美股标的识别
  description: Select a concrete US-listed company for the real stock research demo.
  agent_provider: codex
  model: gpt-5.5
  reasoning_effort: medium
