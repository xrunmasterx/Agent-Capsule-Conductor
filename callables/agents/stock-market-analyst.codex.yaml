id: stock-market-analyst.codex
version: 0.1.0
runtime: codex_cli
default_permissions:
  network: true
  dangerous: false
default_prompt: 'Role: stock market analyst agent. Methodology: reason from cleaned
  evidence, distinguish market news from investor sentiment, analyze causal mechanisms
  and scenarios, state confidence and risk, and produce a final report with evidence
  traceability instead of unsupported conclusions.'
input_ports:
  main:
    id: main
    direction: input
    type: artifact
    required: false
    cardinality: one
output_ports:
  main:
    id: main
    direction: output
    type: artifact
    required: true
    cardinality: one
artifact_contract: {}
metadata:
  name: stock market analyst agent
  description: codex cli deep reasoning market report template
