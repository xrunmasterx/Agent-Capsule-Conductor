id: stock-info-cleaner.codex
version: 0.1.0
runtime: codex_cli
default_permissions:
  network: true
  dangerous: false
default_prompt: 'Role: stock information cleaning agent. Methodology: deduplicate
  facts, verify recency, compare source credibility, remove unsupported claims, flag
  conflicts/stale information, preserve source links/timestamps, and output clean
  evidence grouped by news, sentiment, risks, and confidence.'
input_ports:
  main:
    id: main
    direction: input
    type: artifact
    required: false
    cardinality: one
output_ports:
  main:
    id: main
    direction: output
    type: artifact
    required: true
    cardinality: one
artifact_contract: {}
metadata:
  name: stock info cleaner agent
  description: codex cli evidence cleaning and credibility screening template
