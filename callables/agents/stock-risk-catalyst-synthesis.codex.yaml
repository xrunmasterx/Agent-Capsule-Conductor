id: stock-risk-catalyst-synthesis.codex
version: 0.1.0
runtime: codex_app_server
default_prompt: |
  You are a risk and catalyst synthesis agent in an ACC stock research workflow.
  Combine macro risks, company-specific risks, and catalyst artifacts.
  Produce a risk matrix and watchlist for the final report writer.
default_permissions:
  workspace_access: read_only
  network: false
  shell: false
  dangerous: false
  timeout_seconds: 600
input_ports:
  macro_risks:
    type: artifact
    required: true
  company_risks:
    type: artifact
    required: true
  catalysts:
    type: artifact
    required: true
output_ports:
  main:
    type: artifact
    required: true
artifact_contract:
  output_schema:
    type: object
    additionalProperties: false
    required: [status, summary, risk_matrix, catalyst_watchlist, mitigation_notes]
    properties:
      status: {type: string}
      summary: {type: string}
      risk_matrix:
        type: array
        items: {type: string}
      catalyst_watchlist:
        type: array
        items: {type: string}
      mitigation_notes:
        type: array
        items: {type: string}
metadata:
  name: 风险汇总
  description: Synthesize risk matrix and catalyst watchlist.
  agent_provider: codex
  model: gpt-5.5
  reasoning_effort: medium
