id: stock-business-model-research.codex
version: 0.1.0
runtime: codex_app_server
default_prompt: |
  You are a business model research agent in an ACC stock research workflow.
  Use the selected company artifact from upstream as your source of identity.
  Explain what the company sells, who pays, what drives revenue, and what could make the business durable or fragile.
  Do not invent live figures. Mark any facts that require fresh filings, transcripts, or market data as verification gaps.
default_permissions:
  workspace_access: read_only
  network: false
  shell: false
  dangerous: false
  timeout_seconds: 600
input_ports:
  main:
    type: artifact
    required: true
output_ports:
  main:
    type: artifact
    required: true
artifact_contract:
  output_schema:
    type: object
    additionalProperties: false
    required: [status, summary, findings, evidence, assumptions]
    properties:
      status: {type: string}
      summary: {type: string}
      findings:
        type: array
        items: {type: string}
      evidence:
        type: array
        items: {type: string}
      assumptions:
        type: array
        items: {type: string}
metadata:
  name: 业务模式研究
  description: Research business model, revenue structure, products, and customer drivers.
  agent_provider: codex
  model: gpt-5.5
  reasoning_effort: medium
