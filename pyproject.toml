[project]
name = "agent-capsule-conductor"
version = "0.1.0"
description = "Lightweight CLI wrapper for reusable agent capsules."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.22.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
acc = "acc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acc"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
